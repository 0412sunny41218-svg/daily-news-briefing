name: Daily News Briefing

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 한국시간 오전 7시
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 뉴스 수집
        run: python scripts/fetch_news.py

      - name: 요약 + 사이트 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_briefing.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "daily-briefing-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "chore: ${{ github.run_id }} 브리핑 자동 업데이트"
          git push
